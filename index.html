<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email Performance — Heavy / EntertainmentNow</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #17191e;
    --muted: #6b7077;
    --paper: #eff0f2;
    --card: #ffffff;
    --line: #dcdee2;
    --accent: #17191e;        /* re-skinned by brand toggle */
    --accent-soft: #e7e8ea;
    --up: #1a7f4b;
    --down: #c03221;
    --radius: 10px;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --body: "Inter", system-ui, sans-serif;
    --display: "Barlow Condensed", var(--body);
  }
  [data-brand="sports"]        { --accent: #d31921; --accent-soft: #fbe9ea; }
  [data-brand="entertainment"] { --accent: #7038d6; --accent-soft: #f0e9fb; }

  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: var(--body);
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.45;
  }
  a { color: inherit; }

  /* ---- Masthead ---- */
  header {
    background: var(--card);
    border-bottom: 3px solid var(--accent);
    transition: border-color .25s;
  }
  .masthead {
    max-width: 1180px; margin: 0 auto; padding: 18px 20px 14px;
    display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between;
  }
  h1 {
    font-family: var(--display);
    font-weight: 700; font-size: 28px; letter-spacing: .02em;
    text-transform: uppercase; line-height: 1;
  }
  h1 small {
    display: block; font-family: var(--body); font-weight: 500;
    font-size: 11px; letter-spacing: .08em; color: var(--muted);
    text-transform: uppercase; margin-top: 4px;
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button {
    font-family: var(--display); font-weight: 600; font-size: 15px;
    letter-spacing: .04em; text-transform: uppercase;
    border: 0; background: transparent; color: var(--muted);
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  select, .btn {
    font: 500 13px var(--body); color: var(--ink);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }

  .meta { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .meta b { color: var(--ink); font-weight: 600; }

  /* ---- Topline summary panels ---- */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }
  @media (max-width: 860px) { .panels { grid-template-columns: 1fr; } }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 12px 16px 10px; border-top: 4px solid var(--pcolor);
    border-bottom: 1px solid var(--line);
  }
  .panel-head h2 {
    font-family: var(--display); font-weight: 700; font-size: 21px;
    letter-spacing: .03em; text-transform: uppercase; color: var(--pcolor);
  }
  .panel-head .sub { font-size: 11px; color: var(--muted); font-weight: 500; }
  .panel.sports        { --pcolor: #d31921; }
  .panel.entertainment { --pcolor: #7038d6; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); }
  .metric {
    padding: 12px 16px 10px; border-bottom: 1px solid var(--paper);
  }
  .metric:nth-child(3n+1), .metric:nth-child(3n+2) { border-right: 1px solid var(--paper); }
  .metric .label {
    font-size: 10px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .narrative {
    padding: 12px 16px 14px; font-size: 13px; line-height: 1.55;
    color: var(--ink); border-top: 1px solid var(--line); background: #fcfcfd;
  }
  .narrative b { font-weight: 600; }
  .narrative .flag { color: var(--down); font-weight: 600; }
  .metric .value {
    font-family: var(--mono); font-weight: 600; font-size: 21px;
    margin: 4px 0 3px; font-variant-numeric: tabular-nums;
  }
  .delta {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    padding: 1px 7px; border-radius: 99px;
  }
  .delta.up   { color: var(--up);   background: #e6f4ec; }
  .delta.down { color: var(--down); background: #f9e9e6; }
  .delta.flat { color: var(--muted); background: var(--paper); }

  .sectionhead {
    font-family: var(--display); font-weight: 600; font-size: 17px;
    letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 10px;
  }

  /* ---- Table ---- */
  .tablewrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 880px; }
  thead th {
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); text-align: right; padding: 10px 12px;
    border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th.l { text-align: left; }
  thead th[aria-sort] { color: var(--accent); }
  tbody td {
    padding: 9px 12px; border-bottom: 1px solid var(--paper);
    font-family: var(--mono); font-size: 13px; text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  tbody td.l { text-align: left; font-family: var(--body); }
  tbody tr:hover { background: var(--accent-soft); }
  td .name { font-weight: 600; max-width: 380px; overflow: hidden; text-overflow: ellipsis; display: block; }
  td .name a { text-decoration: none; }
  td .name a:hover { text-decoration: underline; }
  .pill {
    font: 600 10px var(--body); letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 99px; color: #fff;
  }
  .pill.sports { background: #d31921; }
  .pill.entertainment { background: #7038d6; }

  .state { padding: 60px 20px; text-align: center; color: var(--muted); }
  .state .spin {
    width: 26px; height: 26px; margin: 0 auto 12px;
    border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .state.error { color: var(--down); }
</style>
</head>
<body data-brand="all">

<header>
  <div class="masthead">
    <h1>Email Performance<small>Heavy &amp; EntertainmentNow · Campaign Monitor live</small></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Brand">
        <button data-b="all" aria-pressed="true">All</button>
        <button data-b="sports" aria-pressed="false">Sports</button>
        <button data-b="entertainment" aria-pressed="false">Entertainment</button>
      </div>
      <select id="period" aria-label="Period">
        <option value="7">Last 7 full days</option>
        <option value="14">Last 14 full days</option>
        <option value="28" selected>Last 28 full days</option>
      </select>
      <button class="btn" id="refresh">Refresh data</button>
    </div>
  </div>
</header>

<main>
  <div class="meta" id="meta"></div>
  <div class="panels" id="panels"></div>
  <h3 class="sectionhead" id="detailshead">Campaign Details</h3>
  <div class="tablewrap">
    <table id="table" hidden>
      <thead><tr id="headrow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="state" id="state"><div class="spin"></div>Pulling campaigns from Campaign Monitor…</div>
  </div>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let brand = 'all';
  let days = 28;
  let data = null; // { campaigns, cachedAt, from, to, truncated }
  let sortKey = 'sentDate', sortDir = -1;

  const COLS = [
    { k: 'sentDate',   label: 'Sent',      l: true,  fmt: (v) => new Date(v).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) },
    { k: 'name',       label: 'Campaign',  l: true },
    { k: 'brand',      label: 'Brand',     l: true },
    { k: 'recipients', label: 'Sends',     fmt: num },
    { k: 'uniqueOpens',label: 'Opens',     fmt: num },
    { k: 'openRate',   label: 'Open rate', fmt: pct },
    { k: 'clicks',     label: 'Clicks',    fmt: num },
    { k: 'ctr',        label: 'CTR',       fmt: pct },
    { k: 'unsubscribes', label: 'Unsubs',  fmt: num },
  ];

  function num(v) { return v.toLocaleString(); }
  function pct(v) { return (v * 100).toFixed(2) + '%'; }

  async function load(refresh = false) {
    $('#table').hidden = true;
    $('#state').className = 'state';
    $('#state').innerHTML = '<div class="spin"></div>Pulling campaigns from Campaign Monitor…';
    $('#state').hidden = false;

    const qs = new URLSearchParams({ days: String(days) });
    if (refresh) qs.set('refresh', '1');

    const headers = {};
    const key = sessionStorage.getItem('dashKey');
    if (key) headers['x-dashboard-key'] = key;

    try {
      const r = await fetch('/api/campaigns?' + qs, { headers });
      if (r.status === 401) {
        const pw = prompt('Dashboard password:');
        if (pw) { sessionStorage.setItem('dashKey', pw); return load(refresh); }
        throw new Error('A password is required to view this dashboard.');
      }
      const json = await r.json();
      if (!r.ok) throw new Error(json.error || 'Request failed (' + r.status + ')');
      data = json;
      render();
    } catch (e) {
      $('#state').className = 'state error';
      $('#state').textContent = e.message;
      $('#panels').innerHTML = '';
      $('#meta').textContent = '';
    }
  }

  function render() {
    if (!data) return;
    renderPanels();
    const inBrand = (c) => brand === 'all' || c.brand === brand;
    const current = data.campaigns.filter((c) => inBrand(c) && c.period === 'current');
    const previous = data.campaigns.filter((c) => inBrand(c) && c.period === 'previous');
    renderMeta(current, previous);
    $('#detailshead').textContent = 'Campaign Details' +
      (brand === 'all' ? '' : ' — ' + (brand === 'sports' ? 'Heavy' : 'EntertainmentNow'));
    renderTable(current);
  }

  function agg(rows) {
    const t = rows.reduce((a, c) => {
      a.campaigns += 1; a.recipients += c.recipients; a.uniqueOpens += c.uniqueOpens;
      a.clicks += c.clicks; a.unsubscribes += c.unsubscribes; a.bounces += c.bounces; return a;
    }, { campaigns: 0, recipients: 0, uniqueOpens: 0, clicks: 0, unsubscribes: 0, bounces: 0 });
    t.openRate = t.recipients ? t.uniqueOpens / t.recipients : 0;
    t.ctr = t.recipients ? t.clicks / t.recipients : 0;
    return t;
  }

  function deltaChip(cur, prev, isRate, invert) {
    if (!prev && !cur) return '<span class="delta flat">—</span>';
    let txt, dir;
    if (isRate) {
      const pp = (cur - prev) * 100;
      dir = pp > 0.005 ? 'up' : pp < -0.005 ? 'down' : 'flat';
      txt = (pp > 0 ? '▲ +' : pp < 0 ? '▼ ' : '') + pp.toFixed(2) + 'pp';
    } else {
      if (!prev) return '<span class="delta flat">new</span>';
      const ch = ((cur - prev) / prev) * 100;
      dir = ch > 0.5 ? 'up' : ch < -0.5 ? 'down' : 'flat';
      txt = (ch > 0 ? '▲ +' : ch < 0 ? '▼ ' : '') + ch.toFixed(1) + '%';
    }
    if (invert) dir = dir === 'up' ? 'down' : dir === 'down' ? 'up' : 'flat';
    return `<span class="delta ${dir}">${txt}</span>`;
  }

  function shortName(n) {
    n = String(n || '').trim();
    return n.length > 44 ? esc(n.slice(0, 42)) + '…' : esc(n);
  }

  // Auto-generated topline narrative, in the voice of the weekly report.
  function narrative(curRows, prevRows, cur, prev) {
    if (!curRows.length) return 'No campaigns sent in this period.';
    const s = [];
    const hasPrev = prevRows.length > 0;

    // Sentence 1: volume + headline rates
    const orPP = (cur.openRate - prev.openRate) * 100;
    const ctrPP = (cur.ctr - prev.ctr) * 100;
    function rateClause(label, val, pp) {
      if (!hasPrev) return `${label} at <b>${pct(val)}</b>`;
      if (Math.abs(pp) < 0.05) return `${label} steady at <b>${pct(val)}</b>`;
      return `${label} ${pp > 0 ? 'up' : 'down'} <b>${Math.abs(pp).toFixed(2)}pp</b> at <b>${pct(val)}</b>`;
    }
    s.push(
      `<b>${num(cur.campaigns)}</b> campaign${cur.campaigns === 1 ? '' : 's'} reached <b>${num(cur.recipients)}</b> inboxes, ` +
      `with ${rateClause('open rate', cur.openRate, orPP)} and ${rateClause('CTR', cur.ctr, ctrPP)}.`
    );

    // Sentence 2: drivers - best open rate among meaningful-volume sends,
    // plus the biggest click contributor.
    const meaningful = curRows.filter((r) => r.recipients >= Math.max(100, (cur.recipients / cur.campaigns) * 0.25));
    const pool = meaningful.length ? meaningful : curRows;
    const bestOpen = [...pool].sort((a, b) => b.openRate - a.openRate)[0];
    const bestClicks = [...curRows].sort((a, b) => b.clicks - a.clicks)[0];
    if (bestOpen && bestClicks) {
      if (bestOpen.id === bestClicks.id) {
        s.push(`<b>${shortName(bestOpen.name)}</b> led on both engagement (${pct(bestOpen.openRate)} open rate) and clicks (${num(bestOpen.clicks)}).`);
      } else {
        s.push(
          `<b>${shortName(bestOpen.name)}</b> led on engagement (${pct(bestOpen.openRate)} open rate), ` +
          `while <b>${shortName(bestClicks.name)}</b> drove the most clicks (${num(bestClicks.clicks)}).`
        );
      }
    }

    // Sentence 3: flags worth an editor's attention.
    const flags = [];
    if (hasPrev && prev.unsubscribes >= 25 && cur.unsubscribes > prev.unsubscribes * 1.5) {
      flags.push(`unsubscribes up ${(((cur.unsubscribes - prev.unsubscribes) / prev.unsubscribes) * 100).toFixed(0)}% (${num(cur.unsubscribes)})`);
    }
    if (hasPrev && orPP <= -1) flags.push(`open rate down ${Math.abs(orPP).toFixed(2)}pp`);
    if (hasPrev && ctrPP <= -0.25) flags.push(`CTR down ${Math.abs(ctrPP).toFixed(2)}pp`);
    if (cur.recipients && (cur.bounces / cur.recipients) > 0.02) {
      flags.push(`bounce rate at ${pct(cur.bounces / cur.recipients)}`);
    }
    if (flags.length) s.push(`<span class="flag">Worth watching:</span> ${flags.join('; ')}.`);
    if (!hasPrev) s.push('No sends in the prior period, so trend indicators are unavailable.');
    return s.join(' ');
  }

  function renderPanels() {
    const brands = [
      { key: 'sports', title: 'Heavy', sub: 'Sports' },
      { key: 'entertainment', title: 'EntertainmentNow', sub: 'Entertainment' },
    ];
    $('#panels').innerHTML = brands.map((b) => {
      const curRows = data.campaigns.filter((c) => c.brand === b.key && c.period === 'current');
      const prevRows = data.campaigns.filter((c) => c.brand === b.key && c.period === 'previous');
      const cur = agg(curRows);
      const prev = agg(prevRows);
      const metrics = [
        { label: 'Campaigns', v: num(cur.campaigns),  d: deltaChip(cur.campaigns, prev.campaigns) },
        { label: 'Sends',     v: num(cur.recipients), d: deltaChip(cur.recipients, prev.recipients) },
        { label: 'Open rate', v: pct(cur.openRate),   d: deltaChip(cur.openRate, prev.openRate, true) },
        { label: 'Clicks',    v: num(cur.clicks),     d: deltaChip(cur.clicks, prev.clicks) },
        { label: 'CTR',       v: pct(cur.ctr),        d: deltaChip(cur.ctr, prev.ctr, true) },
        { label: 'Unsubs',    v: num(cur.unsubscribes), d: deltaChip(cur.unsubscribes, prev.unsubscribes, false, true) },
      ];
      return `
      <div class="panel ${b.key}">
        <div class="panel-head">
          <h2>${b.title}</h2>
          <span class="sub">${b.sub} · vs prior ${days} days</span>
        </div>
        <div class="metrics">
          ${metrics.map((m) => `
            <div class="metric">
              <div class="label">${m.label}</div>
              <div class="value">${m.v}</div>
              ${m.d}
            </div>`).join('')}
        </div>
        <div class="narrative">${narrative(curRows, prevRows, cur, prev)}</div>
      </div>`;
    }).join('');
  }

  function renderMeta(current, previous) {
    const age = data.cachedAt ? Math.round((Date.now() - data.cachedAt) / 60000) : 0;
    const dropped = data.counts && data.counts.droppedForRateLimit;
    $('#meta').innerHTML =
      `<b>${current.length}</b> campaigns ${data.currentPeriod.from} → ${data.currentPeriod.to} (today's in-flight sends excluded)` +
      ` · compared against <b>${previous.length}</b> from ${data.previousPeriod.from} → ${data.previousPeriod.to}` +
      (brand !== 'all' ? ` · <b>${brand === 'sports' ? 'Heavy Sports' : 'EntertainmentNow'}</b>` : '') +
      ` · data ${data.fromCache ? `cached ${age || '<1'}m ago` : 'fetched just now'}` +
      (dropped ? ` · <b style="color:var(--down)">${dropped} campaigns sampled out to stay under the API rate limit — totals are partial; rates remain representative</b>` : '');
  }

  function renderTable(rows) {
    const sorted = [...rows].sort((a, b) => {
      const va = a[sortKey], vb = b[sortKey];
      return (va > vb ? 1 : va < vb ? -1 : 0) * sortDir;
    });

    $('#headrow').innerHTML = COLS.map((c) =>
      `<th class="${c.l ? 'l' : ''}" data-k="${c.k}" ${sortKey === c.k ? `aria-sort="${sortDir === 1 ? 'ascending' : 'descending'}"` : ''}>
        ${c.label}${sortKey === c.k ? (sortDir === 1 ? ' ↑' : ' ↓') : ''}</th>`).join('');

    $('#tbody').innerHTML = sorted.map((r) => `<tr>${COLS.map((c) => {
      if (c.k === 'name') {
        const inner = r.webVersionUrl
          ? `<a href="${r.webVersionUrl}" target="_blank" rel="noopener" title="${esc(r.subject)}">${esc(r.name)}</a>`
          : esc(r.name);
        return `<td class="l"><span class="name">${inner}</span></td>`;
      }
      if (c.k === 'brand') {
        return `<td class="l"><span class="pill ${r.brand}">${r.brand === 'sports' ? 'Heavy' : 'EntNow'}</span></td>`;
      }
      return `<td class="${c.l ? 'l' : ''}">${c.fmt ? c.fmt(r[c.k]) : r[c.k]}</td>`;
    }).join('')}</tr>`).join('');

    $('#headrow').querySelectorAll('th').forEach((th) => th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
      renderTable(rows);
    }));

    $('#state').hidden = true;
    $('#table').hidden = rows.length === 0;
    if (rows.length === 0) {
      $('#state').hidden = false;
      $('#state').className = 'state';
      $('#state').textContent = 'No campaigns sent in this window. Widen the period or switch brands.';
    }
  }

  function esc(s) { return String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // Controls
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
    brand = b.dataset.b;
    document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    document.body.dataset.brand = brand;
    render();
  }));
  $('#period').addEventListener('change', (e) => { days = +e.target.value; load(); });
  $('#refresh').addEventListener('click', () => load(true));

  load();
})();
</script>
</body>
</html>
